        function renderLanguageButtons() {
            Object.entries(languages).forEach(([code, lang]) => {
                const btn = document.createElement('button');
                btn.className = 'lang-btn' + (code === 'en' ? ' active' : '');
                btn.textContent = lang.name;
                btn.onclick = () => switchLanguage(code);
                languageSelector.appendChild(btn);
            });
        }

        function switchLanguage(code) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.language-content').forEach(div => div.classList.remove('active'));

            event.target.classList.add('active');
            contentArea.innerHTML = languages[code].content;
            localStorage.setItem('grantUnionLanguage', code);
        }

        function initializeLanguage() {
            const saved = localStorage.getItem('grantUnionLanguage') || 'en';
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = Array.from(document.querySelectorAll('.lang-btn')).find(btn => 
                btn.textContent.includes(languages[saved].name.split(' ')[1])
            );
            if (targetBtn) {
                targetBtn.classList.add('active');
            }
            contentArea.innerHTML = languages[saved].content;
        }

        renderLanguageButtons();
        initializeLanguage();
